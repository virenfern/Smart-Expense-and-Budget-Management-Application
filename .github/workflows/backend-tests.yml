name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Run tests with coverage
        env:
          JWT_SECRET_KEY: ci-test-secret
        run: |
          python -m pytest -v --cov=. --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=unit-results.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/htmlcov
            backend/coverage.xml
            backend/unit-results.xml
